# Throwaway embedding benchmark on an x86 AMD EPYC runner (proxy for the Hetzner CPX31 box).
# Runs only on pushes to the embed-bench branch; uses no secrets and no production data.
name: Embedding benchmark (throwaway)

on:
  push:
    branches: [embed-bench]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
      LEAF_PREFIX: "Represent this sentence for searching relevant passages: "
    steps:
      - uses: actions/checkout@v4

      - name: CPU info
        run: |
          grep -o -w -E "avx2|avx512f|avx512_vnni|avx_vnni|amx_int8" /proc/cpuinfo | sort | uniq -c
          free -m | head -2
          echo "### Runner CPU" >> "$GITHUB_STEP_SUMMARY"
          lscpu | grep -E "Model name|^CPU\(s\)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (CPU torch)
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q sentence-transformers onnxruntime transformers huggingface_hub requests numpy

      - name: TEI voyage-4-nano (fp32) - load, latency
        continue-on-error: true
        run: |
          docker run -d --name tei-nano --cpus 4 -p 8082:80 $TEI_IMAGE --model-id voyageai/voyage-4-nano --dtype float32
          for i in $(seq 1 180); do curl -fs localhost:8082/health >/dev/null && break; sleep 5; done
          docker ps -a --filter name=tei-nano --format '{{.Status}}'
          docker logs tei-nano 2>&1 | tail -40
          python bench/bench_tei.py tei_voyage4_nano_fp32 http://localhost:8082 --prefix "Represent the query for retrieving supporting documents: "
          docker stats --no-stream --format 'tei-nano mem {{.MemUsage}}' tei-nano | tee -a "$GITHUB_STEP_SUMMARY"
          docker rm -f tei-nano

      - name: voyage-4-nano sentence-transformers torch CPU (query latency, 4 threads)
        continue-on-error: true
        run: |
          pip install -q peft
          python bench/bench_py.py nano_fp32
          python bench/bench_py.py nano_bf16
