name: Load to MeiliSearch

on:
  workflow_dispatch:
    inputs:
      load_limit:
        description: "Max jobs to load (empty = all pending)"
        required: false
        default: ""
      mode:
        description: "Load mode"
        type: choice
        options:
          - load-pending
          - reload-unparsed
          - meili-status
          - reconcile-meili-dry-run
          - reconcile-meili
          - convert-meili-vectors-dry-run
          - convert-meili-vectors
        default: "load-pending"
      backlog_max_age_days:
        description: "load-pending: skip never-loaded jobs first seen more than N days ago (empty = load the whole backlog)"
        required: false
        default: "2"
      cancel_enqueued_deletes:
        description: "reconcile-meili: cancel queued documentDeletion tasks first"
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: ["Pipeline", "Workable Pipeline"]
    types: [completed]

concurrency:
  group: dopejobs-meili-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load pending jobs to MeiliSearch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_HOST: https://search-internal.dopejobs.xyz
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          REVALIDATE_URL: https://dopejobs.xyz/api/revalidate
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Document vectors are computed by the pipeline (embeddings.py) and sent
          # as user-provided _vectors; without this key Meili embeds as before.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Vector space of the live `jobs` index (see embeddings.py). Must match its search embedder.
          PIPELINE_EMBED_SPACE: voy4liteP256
          PYTHONUNBUFFERED: "1"
          # Scheduled (workflow_run) loads have no inputs and keep the 2-day backlog gate.
          # Decided in the shell: a GitHub `x && y || z` expression would turn an empty
          # dispatch input into the fallback, making "empty = whole backlog" impossible.
          EVENT_NAME: ${{ github.event_name }}
          BACKLOG_INPUT: ${{ inputs.backlog_max_age_days }}
        run: |
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-load-pending}"
          LOAD_LIMIT="${{ inputs.load_limit }}"

          case "$MODE" in
            reconcile-meili-dry-run) ARGS=(--reconcile-meili --dry-run) ;;
            reconcile-meili)
              ARGS=(--reconcile-meili)
              if [ "${{ inputs.cancel_enqueued_deletes }}" = "true" ]; then
                ARGS+=(--cancel-enqueued-deletes)
              fi
              ;;
            convert-meili-vectors-dry-run) ARGS=(--convert-meili-vectors --dry-run) ;;
            *) ARGS=(--"$MODE") ;;
          esac
          if [ -n "$LOAD_LIMIT" ] && [ "$LOAD_LIMIT" != "0" ]; then
            ARGS+=(--load-limit "$LOAD_LIMIT")
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BACKLOG_MAX_AGE_DAYS="$BACKLOG_INPUT"
          else
            BACKLOG_MAX_AGE_DAYS=2
          fi
          if [ "$MODE" = "load-pending" ] && [ -n "$BACKLOG_MAX_AGE_DAYS" ]; then
            ARGS+=(--backlog-max-age-days "$BACKLOG_MAX_AGE_DAYS")
          fi
          [ "$MODE" = "load-pending" ] && echo "Backlog gate: event=$EVENT_NAME max_age_days=${BACKLOG_MAX_AGE_DAYS:-none}"
          uv run python pipeline.py "${ARGS[@]}"
